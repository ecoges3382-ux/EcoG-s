name: Prévenir les applications ouvertes d'une mise à jour

# Dès que Vercel a fini de publier une nouvelle version en production, on envoie un signal à toutes les applications ouvertes
# (diffusion Supabase Realtime, canal « app-version ») : elles cherchent aussitôt la nouvelle version et affichent la bannière
# « Une nouvelle version d'EcoGès est disponible », sans attendre la prochaine vérification ni un rechargement.
# Le signal ne contient rien d'utile : l'application refait elle-même la vérification (voir src/lib/miseAJour.js).
# Le nom du canal et de l'événement doivent rester identiques à ceux de src/lib/miseAJour.js (un test le vérifie).
on:
  deployment_status: {}
  workflow_dispatch: {}

jobs:
  prevenir:
    # Seulement quand Vercel a réussi à publier la PRODUCTION (pas les aperçus de propositions de modification).
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # La clé publique (anon / publishable) est celle que contient déjà l'application (variable VITE_SUPABASE_ANON_KEY de Vercel).
      # Elle se range dans GitHub : Settings > Secrets and variables > Actions > onglet « Secrets » > « Repository secrets »,
      # sous le nom SUPABASE_ANON_KEY (VITE_SUPABASE_ANON_KEY est accepté aussi). Le jeton SUPABASE_ACCESS_TOKEN du déploiement des
      # fonctions n'a pas le droit de lire les clés du projet : on ne peut donc pas la lui demander.
      - name: Envoyer le signal
        env:
          CLE_A: ${{ secrets.SUPABASE_ANON_KEY }}
          CLE_B: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PROJET: xdumihqihcffegjcfhyi
          VERSION: ${{ github.event.deployment.sha || github.sha }}
          MANUEL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          CLE="${CLE_A:-${CLE_B:-}}"
          if [ -z "$CLE" ]; then
            MSG="Signal de mise à jour NON envoyé : aucun secret SUPABASE_ANON_KEY (ni VITE_SUPABASE_ANON_KEY) n'est visible par ce workflow. Ajoute-le dans Settings > Secrets and variables > Actions > Repository secrets (la clé publique « anon » de Supabase, pas la clé secrète)."
            echo "SUPABASE_ANON_KEY visible : non / VITE_SUPABASE_ANON_KEY visible : non"
            # Lancé à la main : on veut voir l'échec. Lancé par une publication : simple avertissement (la publication n'est pas en cause).
            if [ "$MANUEL" = "true" ]; then echo "::error::$MSG"; exit 1; fi
            echo "::warning::$MSG"
            exit 0
          fi
          echo "::add-mask::$CLE"
          CORPS=$(jq -n --arg v "$VERSION" '{messages: [{topic: "app-version", event: "deploy", payload: {version: $v}, private: false}]}')
          CODE=$(curl -sS -o /tmp/reponse.txt -w '%{http_code}' -X POST "https://${PROJET}.supabase.co/realtime/v1/api/broadcast" \
            -H "apikey: ${CLE}" -H "Authorization: Bearer ${CLE}" -H "Content-Type: application/json" -d "$CORPS")
          echo "Réponse de Supabase Realtime : HTTP ${CODE}"
          cat /tmp/reponse.txt
          case "$CODE" in 2*) ;; *) exit 1 ;; esac
