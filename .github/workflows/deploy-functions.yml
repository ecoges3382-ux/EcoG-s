name: Déployer les fonctions Supabase

# Redéploie automatiquement toutes les Edge Functions (supabase/functions/*)
# dès qu'un fichier de ce dossier change sur la branche de travail — pour ne
# plus jamais dépendre d'un copier-coller manuel dans le tableau de bord
# Supabase, qui a déjà causé une régression silencieuse (manage-staff-account
# resté à une vieille version pendant un moment sans que personne le sache).
on:
  push:
    branches:
      - claude/ecogès-school-saas-1ie7fr
    paths:
      - 'supabase/functions/**'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # whatsapp-webhook est appelée par Meta, qui n'envoie aucun jeton
      # Supabase : sans --no-verify-jwt, chaque déploiement réactive la
      # vérification JWT et tous ses appels sont rejetés (401). Sa sécurité
      # repose sur la signature HMAC x-hub-signature-256 vérifiée dans le code.
      - name: Déployer toutes les fonctions
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            if [ "$name" = "whatsapp-webhook" ]; then
              supabase functions deploy "$name" --project-ref xdumihqihcffegjcfhyi --no-verify-jwt
            else
              supabase functions deploy "$name" --project-ref xdumihqihcffegjcfhyi
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
