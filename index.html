<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoGès - Gestion scolaire</title>

    <!-- 1. Librairie pour lire les fichiers Excel (Importation) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <!-- 2. Librairie pour la Visite Guidée (Driver.js) -->
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css">

    <!-- 3. Importation de la police Poppins pour les textes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
      /* --- BARRE DE DÉFILEMENT BLANCHE ET VISIBLE --- */
      ::-webkit-scrollbar {
        -webkit-appearance: none;
        width: 14px !important;
        height: 14px !important;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1) !important;
        border-radius: 0 !important;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #ffffff !important;
        border-radius: 10px !important;
        border: 3px solid transparent !important;
        background-clip: content-box !important;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #e5e7eb !important;
      }
      * {
        scrollbar-width: auto !important;
        scrollbar-color: #ffffff rgba(0, 0, 0, 0.1) !important;
      }

      /* --- APPLICATION DE LA POLICE POPPINS --- */
      body, button, input, select, textarea, a, span, p, div, table, th, td, label {
        font-family: 'Poppins', sans-serif !important;
      }
      
      :root {
        --sans: 'Poppins', sans-serif !important;
      }

      /* --- FIXER LA BARRE LATÉRALE ET LE CONTENU (SCROLL INDÉPENDANT) --- */
      html, body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden !important;
      }
      
      #app {
        height: 100vh !important;
        display: flex !important;
        flex-direction: column !important;
        overflow: hidden !important;
      }
      
      #layout {
        display: flex !important;
        flex: 1 !important;
        overflow: hidden !important;
      }
      
      #sidebar {
        height: 100% !important;
        overflow-y: auto !important;
        flex-shrink: 0 !important;
      }
      
      #screen {
        height: 100% !important;
        overflow-y: auto !important;
        flex: 1 !important;
      }

      /* --- CACHER LA BARRE DE DÉFILEMENT SUR LES ONGLETS --- */
      .hide-scrollbar::-webkit-scrollbar {
        display: none !important;
      }
      .hide-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }
    </style>
  </head>
  <body>
    <!-- L'endroit où React affiche l'application -->
    <div id="root"></div>
    
    <!-- Le moteur de l'application -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
