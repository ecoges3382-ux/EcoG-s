<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoGès - Gestion scolaire</title>

    <!-- Librairie pour lire les fichiers Excel (Importation) -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <!-- Importation de la police Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles globaux (Barre de défilement + Police) -->
    <style>
      /* --- BARRE DE DÉFILEMENT BLANCHE ET VISIBLE --- */
      ::-webkit-scrollbar {
        -webkit-appearance: none;
        width: 14px !important;
        height: 14px !important;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.1) !important;
        border-radius: 0 !important;
      }
      ::-webkit-scrollbar-thumb {
        background-color: #ffffff !important;
        border-radius: 10px !important;
        border: 3px solid transparent !important;
        background-clip: content-box !important;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #e5e7eb !important;
      }
      * {
        scrollbar-width: auto !important;
        scrollbar-color: #ffffff rgba(0, 0, 0, 0.1) !important;
      }

      /* --- APPLICATION DE LA POLICE POPPINS PARTOUT --- */
      body, button, input, select, textarea, a, span, p, div, table, th, td, label {
        font-family: 'Poppins', sans-serif !important;
      }
      
      /* On écrase la variable --sans utilisée par l'application */
      :root {
        --sans: 'Poppins', sans-serif !important;
      }

      /* --- ON GARDE LA BELLE POLICE "SERIF" POUR LES GROS TITRES --- */
      .page-title, 
      h1, h2, h3, 
      .serif-title,
      [style*="font-family: var(--serif)"] {
        font-family: var(--serif) !important;
      }
    </style>
  </head>
  <body>
    <!-- L'endroit où React affiche l'application -->
    <div id="root"></div>
    
    <!-- Le moteur de l'application -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
