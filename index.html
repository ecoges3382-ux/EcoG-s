<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>EcoGès - Gestion scolaire</title>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">

    <style>
      ::-webkit-scrollbar { -webkit-appearance: none; width: 14px !important; height: 14px !important; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1) !important; border-radius: 0 !important; }
      ::-webkit-scrollbar-thumb { background-color: #ffffff !important; border-radius: 10px !important; border: 3px solid transparent !important; background-clip: content-box !important; }
      ::-webkit-scrollbar-thumb:hover { background-color: #e5e7eb !important; }
      * { scrollbar-width: auto !important; scrollbar-color: #ffffff rgba(0,0,0,0.1) !important; }
      body, button, input, select, textarea, a, span, p, div, table, th, td, label { font-family: 'Poppins', sans-serif !important; }
      :root { --sans: 'Poppins', sans-serif !important; }
      
      html, body { margin: 0; padding: 0; height: 100vh; height: 100dvh; overflow: hidden !important; }
      #app { height: 100vh !important; height: 100dvh !important; display: flex !important; flex-direction: column !important; overflow: hidden !important; }
      #layout { display: flex !important; flex: 1 !important; overflow: hidden !important; }
      #sidebar { height: 100% !important; overflow-y: auto !important; flex-shrink: 0 !important; }
      #screen { height: 100% !important; overflow-y: auto !important; flex: 1 !important; }
      .hide-scrollbar::-webkit-scrollbar { display: none !important; }
      .hide-scrollbar { -ms-overflow-style: none !important; scrollbar-width: none !important; }

      @media screen {
        .receipt-quad-print { display: none !important; }
      }
      @media print {
        @page { size: A4; margin: 0; }
        body.receipt-printing > *:not(.receipt-modal-overlay) { display: none !important; }
        body.receipt-printing .receipt-modal-overlay {
          position: static !important;
          background: none !important;
          padding: 0 !important;
          display: block !important;
          inset: auto !important;
        }
        body.receipt-printing .receipt-modal-content {
          box-shadow: none !important;
          border: none !important;
          max-width: none !important;
          max-height: none !important;
          overflow: visible !important;
          background: none !important;
          border-radius: 0 !important;
          padding: 0 !important;
        }
        body.receipt-printing .receipt-screen-only,
        body.receipt-printing .receipt-buttons {
          display: none !important;
        }
        body.receipt-printing .receipt-quad-print {
          display: grid !important;
          grid-template-columns: 105mm 105mm !important;
          grid-template-rows: 148.5mm 148.5mm !important;
          width: 210mm !important;
          height: 297mm !important;
          background: white !important;
        }
        body.receipt-printing .receipt-copy {
          width: 105mm !important;
          height: 148.5mm !important;
          padding: 5mm !important;
          box-sizing: border-box !important;
          overflow: hidden !important;
          border-right: 1px dashed #ccc !important;
          border-bottom: 1px dashed #ccc !important;
        }
        body.receipt-printing .receipt-copy:nth-child(2n) { border-right: none !important; }
        body.receipt-printing .receipt-copy:nth-child(n+3) { border-bottom: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
